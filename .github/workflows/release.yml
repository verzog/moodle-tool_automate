name: Release zip

# Publishing a GitHub release builds the installable plugin zip from the release tag and attaches it to the release.
# To rebuild the zip for an existing release, run this workflow by hand from the Actions tab and enter its tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild the zip for
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: verzog/moodle-ci-workflows/.github/workflows/release-zip.yml@v1
    with:
      tag: ${{ inputs.tag }}
